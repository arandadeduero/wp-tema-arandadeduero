# Cada lunes, un PR con todas las actualizaciones minor y patch y otro, aparte, con las major, por ecosistema.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
      github-actions-major:
        update-types: ["major"]

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "php"
    # No hay composer.lock en el repositorio: sin esto, Dependabot solo actuaría cuando una versión saliera
    # del rango de composer.json.
    versioning-strategy: "increase"
    groups:
      composer-minor-patch:
        update-types: ["minor", "patch"]
      composer-major:
        update-types: ["major"]
    ignore:
      # Bloqueadas por otras dependencias: 10up/wp_mock exige PHPUnit ^9.6 y wp-coding-standards/wpcs exige
      # PHP_CodeSniffer ^3. Quitar estas líneas cuando lo soporten.
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "squizlabs/php_codesniffer"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "js"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
